{% extends "base.html" %}
{% from "_macros.html" import icon with context %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:3rem auto;">
  <div class="card-body" style="text-align:center;padding:2.5rem 1.5rem;">
    <div style="font-size:2.2rem;color:var(--muted);">{{ icon('search' if code == 404 else 'alert') }}</div>
    <h1 style="margin:.6rem 0 .3rem;">{{ 'Page not found' if code == 404 else 'Request problem' }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">Back home</a>
  </div>
</div>
{% endblock %}
