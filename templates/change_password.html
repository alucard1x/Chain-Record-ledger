{% extends "base.html" %}
{% from "_macros.html" import icon with context %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <div class="card-body">
      <h1>Change password</h1>
      <p class="muted">Stored as a salted PBKDF2-SHA256 hash — never as plain text.</p>
      <form method="post">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <div class="field"><label for="current_password">Current password</label>
          <input type="password" id="current_password" name="current_password" autocomplete="current-password" required></div>
        <div class="field"><label for="new_password">New password</label>
          <input type="password" id="new_password" name="new_password" minlength="8" autocomplete="new-password" required>
          <div class="hint">At least 8 characters.</div></div>
        <div class="field"><label for="confirm_password">Confirm new password</label>
          <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">{{ icon('key') }} Update password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
